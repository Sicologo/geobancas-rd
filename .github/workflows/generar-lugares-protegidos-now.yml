name: Generar lugares protegidos ahora

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generar-lugares-protegidos-now.yml"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar capas
        run: python scripts/extraer_lugares_protegidos_osm_v2.py
      - name: Validar y guardar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          layers=['colegios_privados','universidades','estancias_infantiles','centros_discapacidad','clinicas_centros_salud','iglesias_incorporadas_candidatas','cuarteles_recintos_militares','sedes_poderes_estado','organos_extrapoder']
          for x in layers:
              p=Path('public/data')/f'{x}.json'
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['meta']['total'] > 0, f'{x}: vacío'
              assert d['meta']['total'] == len(d['records'])
              print(x, d['meta']['total'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json public/data/*.geojson
          git commit -m "data: generar capas de lugares protegidos RD" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
