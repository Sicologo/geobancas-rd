name: Completar capas protegidas en mapa

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/completar-capas-protegidas-now.yml"

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar integración funcional
        run: python scripts/completar_capas_protegidas_mapa.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar compilación
        run: npm run build

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/GeoMap.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No hay cambios por guardar."
            exit 0
          fi
          git commit -m "feat: integrar información y distancias de todas las capas protegidas"
          git pull --rebase origin main
          git push origin HEAD:main
