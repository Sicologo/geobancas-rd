name: Actualizar iglesias OSM

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/extraer_iglesias_osm.py"
      - ".github/workflows/actualizar-iglesias.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-iglesias-osm
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extraer iglesias desde OpenStreetMap
        run: python scripts/extraer_iglesias_osm.py

      - name: Validar salida
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('public/data/iglesias.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          total = data.get('meta', {}).get('total', 0)
          assert total > 0, 'La extracción produjo 0 registros'
          assert total == len(data.get('records', [])), 'meta.total no coincide con records'
          print(f'Validación correcta: {total} registros')
          PY

      - name: Guardar datos actualizados
        run: |
          if git diff --quiet -- public/data/iglesias.json public/data/iglesias.geojson 2>/dev/null && \
             git ls-files --error-unmatch public/data/iglesias.json >/dev/null 2>&1; then
            echo "No hay cambios en la capa de iglesias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/iglesias.json public/data/iglesias.geojson
          git commit -m "data: actualizar iglesias de República Dominicana"
          git push
