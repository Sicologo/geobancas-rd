name: Depurar experiencia operativa

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/depurar-experiencia-now.yml"
      - "scripts/depurar_experiencia_operativa.py"

permissions:
  contents: write

jobs:
  depurar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar depuracion
        run: python scripts/depurar_experiencia_operativa.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar compilacion
        run: npm run build

      - name: Guardar cambios validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No hay cambios por guardar."
            exit 0
          fi
          git commit -m "fix: depurar distancias y activar flujos operativos"
          git pull --rebase origin main
          git push origin HEAD:main
