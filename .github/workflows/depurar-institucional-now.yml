name: Depurar capas institucionales ahora

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/depurar-institucional-now.yml"

permissions:
  contents: write

jobs:
  depurar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Depurar sedes
        run: python scripts/depurar_capas_institucionales.py
      - name: Validar y guardar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('public/data/sedes_poderes_estado.json').read_text(encoding='utf-8'))
          assert p['meta']['total'] >= 3, p['meta']['total']
          o=json.loads(Path('public/data/organos_extrapoder.json').read_text(encoding='utf-8'))
          assert o['meta']['total'] >= 5, o['meta']['total']
          print('poderes', p['meta']['total'])
          print('extrapoder', o['meta']['total'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sedes_poderes_estado.json public/data/sedes_poderes_estado.geojson public/data/organos_extrapoder.json public/data/organos_extrapoder.geojson
          git commit -m "data: depurar sedes de poderes y órganos extrapoder" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
